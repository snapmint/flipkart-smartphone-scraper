name: Flipkart Smartphone Scraper

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium

      - name: Test Flipkart connectivity
        run: |
          curl -I -L --max-time 20 https://www.flipkart.com

      - name: Run scraper
        run: |
          python smartphone_fk.py

      - name: Check scraper output
        run: |
          echo "Files created by scraper:"
          find . -maxdepth 3 -type f -name "*.xlsx" -print

      - name: Rename output with India date
        run: |
          SCRAPE_DATE=$(TZ=Asia/Kolkata date +"%Y-%m-%d")

          FILE=$(find . -maxdepth 1 -type f -name "flipkart_mobile_*.xlsx" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: No Flipkart Excel file was created."
            echo "Files in workspace:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found Excel file: $FILE"

          mv "$FILE" "flipkart_mobile_assortment_${SCRAPE_DATE}.xlsx"

          echo "Final file:"
          ls -lh *.xlsx

      - name: Upload Excel as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: flipkart-mobile-assortment
          path: "*.xlsx"
          if-no-files-found: error

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_SCRAPER_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Upload Excel to S3
        run: |
          FILE=$(find . -maxdepth 1 -type f -name "*.xlsx" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: No Excel file found for S3 upload."
            exit 1
          fi

          echo "Uploading: $FILE"

          aws s3 cp \
            "$FILE" \
            "s3://snapmint-scraper-739589793672-ap-south-1-an/fk_smartphone/"

          echo "S3 upload completed successfully."
